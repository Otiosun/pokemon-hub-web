name: Champion Store artwork one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/champion-store-art-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add selected external artwork
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          art = {
              'P-U': (
                  'https://archives.bulbagarden.net/media/upload/6/61/Ultra_Ball_PG.png',
                  'Ultra Ball em cena de Pokémon Generations representando o Pack Ultra',
              ),
              'P-E': (
                  'https://archives.bulbagarden.net/media/upload/f/f9/Various_Pok%C3%A9_Balls_XY079_1.png',
                  'Seleção de Poké Balls representando o Pack Especial',
              ),
              'CAP': (
                  'https://archives.bulbagarden.net/media/upload/2/22/James_Pok%C3%A9_Ball_collection.png',
                  'Coleção de Poké Balls representando o Pack do Capturador',
              ),
              'NOITE': (
                  'https://archives.bulbagarden.net/media/upload/d/d0/Dusk_Ball_anime.png',
                  'Dusk Ball em cena da animação representando o Pack Noturno',
              ),
              'AQUA': (
                  'https://archives.bulbagarden.net/media/upload/9/9e/Dive_Ball_anime.png',
                  'Dive Ball em cena da animação representando o Pack Aquático',
              ),
              'COL': (
                  'https://archives.bulbagarden.net/media/upload/d/d4/Various_Pok%C3%A9_Balls_XY079_2.png',
                  'Coleção variada de Poké Balls representando a Caixa do Colecionador',
              ),
          }

          if art['P-U'][0] not in app:
              for code, (src, alt) in art.items():
                  marker = f"    code: '{code}',"
                  start = app.index(marker)
                  category = "    category: 'POKÉ BALLS',\n"
                  insert_at = app.index(category, start) + len(category)
                  next_offer = app.find("\n  {\n    code:", insert_at)
                  scope_end = next_offer if next_offer != -1 else len(app)
                  if '    artSrc:' in app[insert_at:scope_end]:
                      raise RuntimeError(f'{code} already has artSrc')
                  addition = f"    artSrc: '{src}',\n    artAlt: '{alt}',\n"
                  app = app[:insert_at] + addition + app[insert_at:]
              app_path.write_text(app, encoding='utf-8')

          vercel_path = Path('vercel.json')
          vercel = vercel_path.read_text(encoding='utf-8')
          if 'https://archives.bulbagarden.net' not in vercel:
              old = "img-src 'self' data: blob: https://raw.githubusercontent.com https://play.pokemonshowdown.com https://*.r2.dev"
              new = "img-src 'self' data: blob: https://raw.githubusercontent.com https://play.pokemonshowdown.com https://archives.bulbagarden.net https://*.r2.dev"
              if old not in vercel:
                  raise RuntimeError('img-src CSP marker not found')
              vercel = vercel.replace(old, new, 1)
              vercel_path.write_text(vercel, encoding='utf-8')

          readme_path = Path('public/champion-store/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          heading = '## Complementos externos do catálogo'
          if heading not in readme:
              readme += '''\n\n## Complementos externos do catálogo\n\nOs cards abaixo usam imagens remotas do Bulbagarden Archives, sem espelhar os arquivos no repositório. São screenshots/arquivos de Pokémon sujeitos aos respectivos titulares; as páginas de origem registram a postura de uso declarada pelo arquivo.\n\n- Pack Ultra — https://archives.bulbagarden.net/wiki/File:Ultra_Ball_PG.png\n- Pack Especial — https://archives.bulbagarden.net/wiki/File:Various_Pok%C3%A9_Balls_XY079_1.png\n- Pack do Capturador — https://archives.bulbagarden.net/wiki/File:James_Pok%C3%A9_Ball_collection.png\n- Pack Noturno — https://archives.bulbagarden.net/wiki/File:Dusk_Ball_anime.png\n- Pack Aquático — https://archives.bulbagarden.net/wiki/File:Dive_Ball_anime.png\n- Caixa do Colecionador — https://archives.bulbagarden.net/wiki/File:Various_Pok%C3%A9_Balls_XY079_2.png\n\nPoké Ball Personalizada e Kit do Treinador permanecem sem arte até existir uma referência realmente adequada ao conceito.\n'''
              readme_path.write_text(readme, encoding='utf-8')

      - name: Commit store artwork and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/champion-store-art-once.yml
          git add src/App.tsx vercel.json public/champion-store/README.md
          git commit -m "feat(store): add contextual Poké Ball artwork"
          git push origin HEAD:main
