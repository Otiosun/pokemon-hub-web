name: Cleanup validation

on:
  pull_request:
    branches:
      - feat/pokemon-detail-v1

concurrency:
  group: cleanup-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@11.23.0 --activate

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Lint
        run: pnpm check

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: /tmp/typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Unit tests
        run: pnpm test:run

      - name: Full production verify
        run: pnpm verify

      - name: Browser smoke against production build
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME" ]]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/pokemon-hub-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/jornada >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/jornada >/dev/null

          smoke() {
            local path="$1"
            local needle="$2"
            local dom
            echo "SMOKE ${path} -> ${needle}"
            dom="$($CHROME \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=5000 \
              --dump-dom \
              "http://127.0.0.1:4173${path}" \
              2>/tmp/pokemon-hub-chrome.log)" || {
                cat /tmp/pokemon-hub-chrome.log
                cat /tmp/pokemon-hub-vite-preview.log
                exit 1
              }

            if ! grep -Fq "$needle" <<<"$dom"; then
              echo "Expected marker not found for ${path}: ${needle}"
              echo "$dom" | head -c 12000
              echo
              cat /tmp/pokemon-hub-chrome.log || true
              cat /tmp/pokemon-hub-vite-preview.log || true
              exit 1
            fi
          }

          smoke "/jornada" "TRAINER REGISTRATION LICENSE"
          smoke "/pokedex" "Índice Nacional"
          smoke "/pokedex/4" "Nº 004"
          smoke "/pokemon" "Time + Box"
          smoke "/pokemon/pkm-charmander-a1" "Brasa"
          smoke "/team" "Meu Time"
          smoke "/pokemon/demo-charmander" "Nº 004"
          smoke "/asset-lab" "ENDEREÇO INDISPONÍVEL"
          smoke "/pokemon/demo-inexistente" "ENDEREÇO INDISPONÍVEL"
          smoke "/pokedex/999" "ENDEREÇO INDISPONÍVEL"
          smoke "/rota-inexistente" "ENDEREÇO INDISPONÍVEL"

      - name: Capture mobile viewport evidence
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME" ]]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          mkdir -p /tmp/mobile-viewport-evidence /tmp/mobile-viewer-diagnostics
          pnpm exec vite preview --host 127.0.0.1 --port 4174 > /tmp/pokemon-hub-mobile-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/jornada >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4174/jornada >/dev/null

          capture() {
            local name="$1"
            local path="$2"
            local width="$3"
            local output="/tmp/mobile-viewport-evidence/${name}-${width}x900.png"
            local dom="/tmp/mobile-viewer-diagnostics/${name}-${width}x900.dom.html"
            local log="/tmp/mobile-viewer-diagnostics/${name}-${width}x900.chrome.log"
            echo "CAPTURE ${path} @ ${width}x900"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --enable-unsafe-swiftshader \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="${width},900" \
              --virtual-time-budget=5000 \
              --dump-dom \
              --screenshot="$output" \
              "http://127.0.0.1:4174${path}" \
              >"$dom" 2>"$log" || {
                cat "$log"
                cat /tmp/pokemon-hub-mobile-preview.log
                exit 1
              }
            test -s "$output"
            test -s "$dom"
          }

          for width in 320 360 390 430; do
            capture jornada "/jornada" "$width"
            capture pokedex "/pokedex" "$width"
            capture species-004 "/pokedex/4" "$width"
            capture box "/pokemon" "$width"
            capture team "/team" "$width"
            capture owned-charmander "/pokemon/pkm-charmander-a1" "$width"
          done

          test "$(find /tmp/mobile-viewport-evidence -type f -name '*.png' | wc -l)" -eq 24
          test "$(find /tmp/mobile-viewer-diagnostics -type f -name '*.dom.html' | wc -l)" -eq 24

          for width in 320 360 390 430; do
            for name in species-004 owned-charmander; do
              dom="/tmp/mobile-viewer-diagnostics/${name}-${width}x900.dom.html"
              if grep -Fq "Charmander · Idle" "$dom"; then
                state="ready"
              elif grep -Fq "Falha ao carregar Charmander." "$dom"; then
                state="failed"
              elif grep -Fq "carregando Charmander" "$dom"; then
                state="loading"
              else
                state="unknown"
              fi
              echo "VIEWER_STATE ${name} ${width}px = ${state}" | tee -a /tmp/mobile-viewer-diagnostics/viewer-state-summary.txt
            done
          done

          cp /tmp/pokemon-hub-mobile-preview.log /tmp/mobile-viewer-diagnostics/vite-preview.log

      - name: Upload mobile viewport evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewport-evidence
          path: /tmp/mobile-viewport-evidence/*.png
          if-no-files-found: error
          retention-days: 3

      - name: Upload mobile viewer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewer-diagnostics
          path: /tmp/mobile-viewer-diagnostics
          if-no-files-found: error
          retention-days: 3
