name: Cleanup validation

on:
  push:
    branches:
      - cleanup/product-integrity-v1
  pull_request:
    branches:
      - feat/pokemon-detail-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@11.23.0 --activate

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run
