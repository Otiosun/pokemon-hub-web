name: Cloudflare deploy smoke

on:
  push:
    branches:
      - feat/pokemon-detail-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-smoke-feat-pokemon-detail-v1
  cancel-in-progress: true

jobs:
  verify-cloudflare-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for current Cloudflare branch deployment
        shell: bash
        env:
          PROBE_URL: https://feat-pokemon-detail-v1-pokemon-hub-web.natanaelgames19.workers.dev/deploy-probe-v3.txt
          EXPECTED: POKEMON_HUB_V3_DEPLOY_PROBE_2026-08-27_A
        run: |
          set -u
          last_response=""
          for attempt in $(seq 1 36); do
            echo "Cloudflare probe attempt ${attempt}/36"
            if response=$(curl --fail --silent --show-error --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "${PROBE_URL}?probe=${GITHUB_SHA}-${attempt}" 2>&1); then
              last_response="$response"
              if [ "$response" = "$EXPECTED" ]; then
                echo "Cloudflare branch alias is serving the current V3 deploy probe."
                exit 0
              fi
              echo "Probe endpoint responded, but token is not current: ${response}"
            else
              last_response="$response"
              echo "Probe not available yet: ${response}"
            fi
            sleep 10
          done

          echo "Cloudflare branch alias did not serve the expected probe within the verification window."
          echo "Last response: ${last_response}"
          exit 1
