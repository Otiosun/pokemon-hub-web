name: Control Center Format Once

on:
  push:
    branches:
      - feat/admin-control-center-foundation-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/admin-control-center-foundation-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Apply canonical Biome formatting
        run: npx biome check --write control-center/src control-center/vite.config.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/src control-center/vite.config.ts
          git commit -m "style(admin): apply canonical Biome formatting"
          git push origin HEAD:feat/admin-control-center-foundation-v1
