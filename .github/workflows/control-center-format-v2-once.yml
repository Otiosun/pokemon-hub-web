name: Control Center Format V2 Once

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/admin-control-center-foundation-v1'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: control-center
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Apply canonical Biome formatting
        run: pnpm exec biome check --write src vite.config.ts
      - name: Verify Control Center formatting
        run: pnpm exec biome check src vite.config.ts
      - name: Upload formatted boundary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-biome-formatted
          path: |
            control-center/src
            control-center/vite.config.ts
          if-no-files-found: error
          retention-days: 1
