name: Control Center Format V2 Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/admin-control-center-foundation-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/admin-control-center-foundation-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Apply canonical Biome formatting
        run: npx biome check --write control-center/src control-center/vite.config.ts
      - name: Verify Control Center formatting
        run: npx biome check control-center/src control-center/vite.config.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- control-center/src control-center/vite.config.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/src control-center/vite.config.ts
          git commit -m "style(admin): apply canonical Control Center formatting"
          git push origin HEAD:feat/admin-control-center-foundation-v1
