name: Diag Hub Lint Artifact

on:
  push:
    branches:
      - diag/hub-final-gate-v2

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@11.23.0 --activate
      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Capture lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm check > /tmp/hub-lint.log 2>&1
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-lint-diagnostics
          path: /tmp/hub-lint.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail when lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
