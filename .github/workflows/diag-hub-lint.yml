name: Diag Hub Lint

on:
  push:
    branches:
      - diag/hub-final-gate-v2

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@11.23.0 --activate
      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/hub-lint.log
