name: Hub + Bot Exploration Release Candidate Integration

on:
  pull_request:
    branches:
      - integration/hub-release-gate-20261030
    paths:
      - ".github/workflows/hub-bot-release-integration.yml"
      - "src/features/admin/**"
      - "src/player-api/**"
      - "scripts/uat/premiumCrossRepo.integration.test.ts.template"

permissions:
  contents: read

jobs:
  disposable-hub-and-bot:
    if: github.head_ref == 'integration/hub-exploration-release-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/postgres
    steps:
      - name: Checkout Hub candidate (PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact Bot release gate candidate (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Otiosun/sla
          ref: 9c2e834ad7e822b10049bb07670fa28ef8c934b3
          path: backend
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install both exact source trees
        run: |
          pnpm install --ignore-scripts --no-frozen-lockfile
          cd backend
          pnpm install --ignore-scripts --frozen-lockfile
      - name: Verify disposable database and source SHAs
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/postgres'||process.env.APP_ENV!=='test')process.exit(1)"
          test "$(git -C backend rev-parse HEAD)" = "9c2e834ad7e822b10049bb07670fa28ef8c934b3"
          git rev-parse HEAD
      - name: Typecheck Hub candidate
        run: pnpm typecheck
      - name: Premium real handlers via Hub BFF, disposable PostgreSQL
        run: |
          set -euo pipefail
          cp scripts/uat/premiumCrossRepo.integration.test.ts.template src/player-api/premiumCrossRepo.integration.test.ts
          trap 'rm -f src/player-api/premiumCrossRepo.integration.test.ts' EXIT
          pnpm exec vitest run src/player-api/premiumCrossRepo.integration.test.ts
      - name: Stage2 management UI + API contracts
        run: |
          pnpm exec vitest run \
            src/features/admin/adminPokemonOperationWorkflow.test.ts \
            src/features/admin/adminPokemonPendingIntent.test.ts \
            src/features/admin/adminPokemonRetryIntent.test.ts \
            src/player-api/playerPortalPokemon.test.ts \
            src/player-api/manualPremiumPokemonClient.test.ts
