name: Hub Release Protected Navigation Proof

on:
  pull_request:
    branches:
      - feat/pokemon-management-stage2-20261027
    paths:
      - scripts/check-navigation-history-cdp.mjs
      - .github/workflows/hub-release-navigation-proof.yml
      - src/features/pokedex/**
      - src/features/collection/**

permissions:
  contents: read

jobs:
  browser-history:
    if: github.head_ref == 'integration/hub-release-gate-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Build exact SPA without slow external asset generation
        run: pnpm exec vite build
      - name: Chrome protected navigation and history
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          pnpm exec vite preview --host 127.0.0.1 --port 4175 > /tmp/history-vite.log 2>&1 &
          PREVIEW_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
            --user-data-dir=/tmp/pokemon-hub-history-short-profile about:blank \
            > /tmp/history-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:4175/pokedex >/dev/null &&
               curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null; then break; fi
            if [ "$n" -eq 80 ]; then cat /tmp/history-vite.log /tmp/history-chrome.log; exit 1; fi
            sleep 0.25
          done
          CDP_ENDPOINT=http://127.0.0.1:9223 BASE_URL=http://127.0.0.1:4175 \
            timeout 110s node scripts/check-navigation-history-cdp.mjs
