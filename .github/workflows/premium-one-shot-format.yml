name: One-shot Premium branch formatting repair

on:
  push:
    branches:
      - fix/premium-delegated-delivery-20261026
    paths:
      - .github/workflows/premium-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Otiosun/pokemon-hub-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the isolated Premium branch
        uses: actions/checkout@v4
        with:
          ref: fix/premium-delegated-delivery-20261026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Install dependencies without scripts
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Format the exact Player API gate inputs
        run: |
          pnpm exec biome format --write src/player-api src/vite-env.d.ts api tsconfig.json vercel.json
          pnpm exec biome format src/player-api src/vite-env.d.ts api tsconfig.json vercel.json

      - name: Remove this temporary workflow and commit only formatting
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/premium-delegated-delivery-20261026'
          rm .github/workflows/premium-one-shot-format.yml
          git add src/player-api src/vite-env.d.ts api tsconfig.json vercel.json .github/workflows/premium-one-shot-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'style(player-api): apply required Biome formatting on Premium draft branch'
          git push origin HEAD:refs/heads/fix/premium-delegated-delivery-20261026
