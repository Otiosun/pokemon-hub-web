name: Release1 Preview Isolation + Full Premium Regression (Disposable)
on:
  pull_request:
    branches:
      - fix/premium-uncertain-grant-lock-20261030
    paths:
      - "src/player-api/**"
      - "api/hub/**"
      - "vercel.json"
      - ".github/workflows/release1-preview-isolation-full-proof.yml"
permissions:
  contents: read
jobs:
  backend-and-hub:
    if: github.head_ref == 'fix/release1-preview-upstream-isolation-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Otiosun/sla
          ref: f32763f675e1ea96c5e6d92757402a63ce550700
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - name: Install isolated exact trees (no lifecycle scripts)
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          (cd backend && pnpm install --frozen-lockfile --ignore-scripts)
      - name: Validate no live database and pinned backend SHA
        shell: bash
        run: |
          set -euo pipefail
          node -e "let u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/postgres'||process.env.APP_ENV!=='test')process.exit(1)"
          test "$(git -C backend rev-parse HEAD)" = f32763f675e1ea96c5e6d92757402a63ce550700
      - run: pnpm typecheck
      - name: Real Hub BFF + bot HTTP handlers, disposable PG18
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/uat/premiumCrossRepo.integration.test.ts.template src/player-api/premiumCrossRepo.integration.test.ts
          trap 'rm -f src/player-api/premiumCrossRepo.integration.test.ts' EXIT
          pnpm exec vitest run src/player-api/premiumCrossRepo.integration.test.ts
      - name: Stage2 management + evolution + preview isolation contracts
        run: |
          pnpm exec vitest run \
            src/player-api/vercelPreviewIsolation.test.ts \
            src/player-api/evolutionConsolidatedProxy.test.ts \
            src/player-api/playerPortalPokemon.test.ts \
            src/features/admin/adminPokemonOperationWorkflow.test.ts \
            src/features/admin/adminPokemonPendingIntent.test.ts \
            src/features/admin/adminPokemonRetryIntent.test.ts
  isolated-chrome:
    if: github.head_ref == 'fix/release1-preview-upstream-isolation-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_PREMIUM_STAGING_UI: "1"
      VITE_PREMIUM_STAGING_TARGET: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec vite build
      - name: Chrome mobile owner/delegate/denied visual proof (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/pokemon-premium-release-browser
          pnpm exec vite preview --host 127.0.0.1 --port 4177 > /tmp/pokemon-preview.log 2>&1 &
          WEB_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9227 \
            --user-data-dir=/tmp/pokemon-release-private-chrome about:blank \
            > /tmp/pokemon-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$WEB_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4177/admin/premium >/dev/null && curl -fsS http://127.0.0.1:9227/json/version >/dev/null; then break; fi
            if [ "$n" -eq 80 ]; then cat /tmp/pokemon-preview.log /tmp/pokemon-chrome.log; exit 1; fi
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:4177 CDP_ENDPOINT=http://127.0.0.1:9227 \
            OUTPUT_DIR=/tmp/pokemon-premium-release-browser \
            timeout 130s node scripts/uat/premiumSyntheticBrowserCdp.mjs
          test "$(find /tmp/pokemon-premium-release-browser -name '*.png' | wc -l)" -eq 8
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release1-preview-premium-synthetic-360-390
          path: /tmp/pokemon-premium-release-browser/*.png
          if-no-files-found: warn
