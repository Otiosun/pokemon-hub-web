name: V63 Admin Validation

on:
  push:
    branches:
      - "feature/admin-progression-control-v63"

permissions:
  contents: read

concurrency:
  group: v63-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm check
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test:run
      - name: Production build
        run: pnpm build
